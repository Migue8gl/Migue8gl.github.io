---
layout: none
---
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Basic -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title -->
  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <!-- Description -->
  <meta name="description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  {% endif %}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml"
        title="{{ site.title }}"
        href="{{ '/feed.xml' | relative_url }}">

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://polyfill.io">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'pre', 'code'],
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
  </script>

  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Mermaid -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
    await mermaid.run({ querySelector: 'code.language-mermaid' });
  </script>

  <!-- Structured Data -->
  {% if page.layout == 'post' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title }}",
    "description": "{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author }}"
    },
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}"
    }
  }
  </script>
  {% endif %}
</head>

{% include analytics.html %}

<body{% if page.layout == 'post' %} class="post-page"{% endif %}>

  <!-- Header -->
  <header>
    <nav>
      <center>
        <a href="/">Home</a> ·
        <a href="/blog.html">Blog</a> ·
        <a href="/about.html">About</a> ·
      </center>
    </nav>
  </header>

  <hr>

  <!-- Main -->
  <main>
    {{ content }}
  </main>

  <!-- Footer -->
  <footer>
    <hr>
    <center>
      <small>
        <a href="{{ site.github_link }}">GitHub</a> ·
        <a href="{{ site.buymeacoffee_link }}">Buy me a coffee</a>
      </small>
    </center>
  </footer>

  <!-- TOC -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!document.body.classList.contains('post-page')) return;

      const content = document.querySelector('main');
      const headings = content.querySelectorAll('h2, h3, h4, h5, h6');
      if (!headings.length) return;

      const toc = document.createElement('nav');
      toc.className = 'table-of-contents';
      toc.setAttribute('aria-label', 'Tabla de contenidos');

      const title = document.createElement('h2');

      const rootList = document.createElement('ul');
      let currentLists = [rootList];
      let lastLevel = 2;

      headings.forEach((heading, index) => {
        const level = parseInt(heading.tagName.substring(1));
        heading.id ||= `heading-${index}`;

        if (level > lastLevel) {
          const newList = document.createElement('ul');
          currentLists[currentLists.length - 1].lastElementChild?.appendChild(newList);
          currentLists.push(newList);
        } else if (level < lastLevel) {
          currentLists.splice(level - 1);
        }

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `#${heading.id}`;
        a.textContent = heading.textContent;

        li.appendChild(a);
        currentLists[currentLists.length - 1].appendChild(li);
        lastLevel = level;
      });

      toc.appendChild(rootList);
      
      // Insertar después del .post-meta
      const postMeta = content.querySelector('.post-meta');
      if (postMeta && postMeta.nextSibling) {
        postMeta.parentNode.insertBefore(toc, postMeta.nextSibling);
      } else if (postMeta) {
        postMeta.parentNode.appendChild(toc);
      } else {
        content.insertBefore(toc, content.firstChild);
      }
    });
  </script>

</body>
</html>
