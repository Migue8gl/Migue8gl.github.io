<!-- Modal de Suscripción - _includes/subscribe-modal.html -->
<div id="subscribe-modal" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>Suscribete</h2>
    <p>Recibe los nuevos posts en tu correo</p>
    
    <div id="form-container">
      <input type="email" id="email-input" placeholder="tu@email.com">
      <button id="submit-btn" onclick="submitEmail()">Suscribirme</button>
    </div>
    
    <p id="form-message"></p>
  </div>
</div>

<style>
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-overlay.active { display: flex; }

.modal-box {
  background-color: #262626;
  border: 1px solid #373737;
  padding: 2rem;
  border-radius: 4px;
  max-width: 380px;
  width: 90%;
  text-align: center;
  position: relative;
}

.modal-box h2 {
  color: #e6edf3;
  font-weight: 500;
  margin-top: 0;
  margin-bottom: 0.5rem;
}

.modal-box p {
  color: #8b949e;
  margin-bottom: 1.5rem;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 1.5rem;
  background: none;
  border: none;
  cursor: pointer;
  color: #8b949e;
  transition: color 0.15s ease;
}
.modal-close:hover { color: #e6edf3; }

#email-input {
  width: 100%;
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
  border: 1px solid #373737;
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
  box-sizing: border-box;
  background-color: #1c1c1e;
  color: #c9d1d9;
}
#email-input:focus {
  outline: none;
  border-color: #3b82f6;
}
#email-input::placeholder {
  color: #6e7681;
}

#submit-btn {
  width: 100%;
  padding: 0.75rem 1rem;
  background-color: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
#submit-btn:hover {
  background-color: #60a5fa;
}
#submit-btn:disabled {
  background-color: #484f58;
  cursor: not-allowed;
}

#form-message {
  margin-top: 1rem;
  margin-bottom: 0;
  font-size: 0.9rem;
}
#form-message.success { color: #3fb950; }
#form-message.error { color: #f85149; }
</style>

<script>
const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSclntEj50Y3KW7bHI5w3-p1b5kaXsZbs4gD15NIMj4ioXxXKw/formResponse';
const EMAIL_FIELD = 'entry.259361416';

function openModal() {
  document.getElementById('subscribe-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('subscribe-modal').classList.remove('active');
  document.getElementById('form-message').textContent = '';
  document.getElementById('form-message').className = '';
}

function submitEmail() {
  const email = document.getElementById('email-input').value;
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('form-message');
  
  if (!email || !email.includes('@')) {
    msg.textContent = 'Ingresa un email valido';
    msg.className = 'error';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  
  const iframe = document.createElement('iframe');
  iframe.name = 'hidden-iframe';
  iframe.style.display = 'none';
  document.body.appendChild(iframe);
  
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = FORM_URL;
  form.target = 'hidden-iframe';
  
  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = EMAIL_FIELD;
  input.value = email;
  form.appendChild(input);
  
  document.body.appendChild(form);
  form.submit();
  
  setTimeout(() => {
    document.body.removeChild(form);
    document.body.removeChild(iframe);
    
    msg.textContent = 'Gracias por suscribirte';
    msg.className = 'success';
    document.getElementById('email-input').value = '';
    btn.disabled = false;
    btn.textContent = 'Suscribirme';
    
    localStorage.setItem('subscribed', 'true');
    setTimeout(closeModal, 2000);
  }, 1500);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('email-input').addEventListener('keypress', e => {
    if (e.key === 'Enter') submitEmail();
  });
});
</script>
